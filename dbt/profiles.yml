# Connection settings come from the standard libpq variables, shared with the Python loader.
findata:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | as_number }}"
      user: "{{ env_var('PGUSER', 'findata') }}"
      password: "{{ env_var('PGPASSWORD', 'findata') }}"
      dbname: "{{ env_var('PGDATABASE', 'warehouse') }}"
      schema: analytics
      threads: 4
