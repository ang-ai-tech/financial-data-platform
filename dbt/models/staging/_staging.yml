version: 2

models:
  - name: stg_ecb__exchange_rates
    description: "ECB reference rates, renamed and typed. Grain: one row per currency per business day."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, rate_date]
    columns:
      - name: currency_code
        data_tests: [not_null]
      - name: rate_date
        data_tests: [not_null]
      - name: eur_rate
        description: Units of currency per 1 EUR.
        data_tests: [not_null, positive_values]

  - name: stg_fred__observations
    description: "FRED observations. Grain: one row per series per observation date."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [series_id, observation_date]
    columns:
      - name: series_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_fred__series')
                field: series_id
      - name: observation_date
        data_tests: [not_null]
      - name: value
        data_tests: [not_null]

  - name: stg_fred__series
    description: FRED series metadata.
    columns:
      - name: series_id
        data_tests: [unique, not_null]
      - name: frequency
        data_tests:
          - accepted_values:
              arguments:
                values: [daily, weekly, monthly, quarterly]
